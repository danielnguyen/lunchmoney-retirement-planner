# Owner-only opt-in: use after compose.yaml and compose.git-managed.yaml.
services:
  planner:
    environment:
      PLANNER_CONFIG_WRITE_ENABLED: "false"
      PLANNER_GIT_SYNC_ENABLED: "true"
      PLANNER_GIT_REPOSITORY: ${PLANNER_GIT_REPOSITORY:-}
      PLANNER_GIT_BRANCH: ${PLANNER_GIT_BRANCH:-}
      PLANNER_GIT_PATH: ${PLANNER_GIT_PATH:-}
      PLANNER_GIT_READ_TOKEN: ${PLANNER_GIT_READ_TOKEN:-}
      PLANNER_BROWSER_ORIGIN: ${PLANNER_BROWSER_ORIGIN:-}
    volumes:
      - ${PLANNER_ACTIVE_CONFIG_DIR:-./config}:/app/config:rw,Z
